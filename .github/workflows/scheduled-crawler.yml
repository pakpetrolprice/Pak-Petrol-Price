name: Scheduled Fuel Price Crawler

on:
  schedule:
    # 1. Continuous 2-Hour Fuel Crawler:
    # Runs every 2 hours around the clock at minute 15 (01:15, 03:15, 05:15, etc. PKT / 20:15, 22:15, 00:15, etc. UTC)
    - cron: '15 */2 * * *'

    # 2. High-Frequency Overnight Notification Watcher:
    # Runs every 10 minutes between 11:00 PM and 05:00 AM Pakistan Standard Time (PKT)
    # when government price revision notifications are typically released.
    - cron: '*/10 18-23,0 * * *'
  workflow_dispatch: # Allows instant manual trigger anytime from GitHub Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Fuel Price Crawler Endpoint
        env:
          INPUT_SITE_URL: ${{ secrets.SITE_URL }}
          INPUT_NETLIFY_URL: ${{ secrets.NETLIFY_SITE_URL }}
          INPUT_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="$INPUT_SITE_URL"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$INPUT_NETLIFY_URL"
          fi
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://pakpetrolprice.pk"
          fi
          # Strip trailing slash if present
          TARGET_URL="${TARGET_URL%/}"
          echo "Target crawler URL: $TARGET_URL/api/cron/check-prices"
          
          CRON_TOKEN="$INPUT_CRON_SECRET"
          if [ -z "$CRON_TOKEN" ]; then
            CRON_TOKEN="695ad9c1f065fba1afa78c9a0eb5f4cc0c675509aec0f64b"
          fi
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$TARGET_URL/api/cron/check-prices?key=$CRON_TOKEN" \
               -H "Authorization: Bearer $CRON_TOKEN")
          
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -n 's/.*HTTP_STATUS://p')
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Crawler endpoint failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "All 6 fuel rates scraped, verified, and updated successfully."
